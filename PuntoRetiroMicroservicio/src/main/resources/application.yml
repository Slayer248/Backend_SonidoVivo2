server:
  port: 8086
  forward-headers-strategy: framework

spring:
  application:
    name: punto-retiro-microservicio
  datasource:
    url: jdbc:mysql://localhost:3306/sonidovivo_puntos_retiro?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: ""
  flyway:
    enabled: true
    # Bases que ya existían (creadas por Hibernate) se toman como punto de partida y se completan con las migraciones
    baseline-on-migrate: true
    baseline-version: "0"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  web:
    error:
      include-message: always
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    status-page-url-path: /swagger-ui.html
